<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>iVIDEO · neon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; }
    body {
      background: #0b0b12;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      overflow: hidden;
    }

    /* main app card - full width, no side padding */
    .app-container {
      max-width: 100%;
      width: 100%;
      height: 100vh;
      background: linear-gradient(145deg, #0f0f1a, #1a1a2e);
      padding: 0;
      box-shadow: none;
      border: none;
      border-radius: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    /* animated neon border - now it's a glowing edge effect */
    .app-container::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      background: linear-gradient(45deg, #ff00cc, #3333ff, #00ffcc, #ffcc00, #ff00cc);
      background-size: 400% 400%;
      border-radius: 0;
      z-index: -1;
      opacity: 0.4;
      animation: neonBorder 6s ease infinite;
      filter: blur(3px);
    }
    @keyframes neonBorder {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* super thin header */
    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: rgba(0,0,0,0.2);
      backdrop-filter: blur(6px);
      z-index: 20;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      height: 38px;
    }
    .header-btn {
      background: transparent;
      border: none;
      color: #c0c8ff;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 6px;
      transition: 0.2s;
      text-shadow: 0 0 10px rgba(100, 150, 255, 0.5);
    }
    .header-btn:hover { color: #fff; transform: scale(1.1); }
    .app-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 1.5px;
      background: linear-gradient(90deg, #ff6fcf, #6f8eff, #6fffb0);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(100, 150, 255, 0.3);
      animation: titleGlow 3s ease-in-out infinite alternate;
      font-family: 'Inter', sans-serif;
    }
    @keyframes titleGlow {
      0% { filter: drop-shadow(0 0 5px rgba(255,100,200,0.5)); }
      100% { filter: drop-shadow(0 0 20px rgba(100,200,255,0.9)); }
    }

    /* video wrapper - full width, no margins */
    .video-wrapper {
      position: relative;
      flex: 1;
      width: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      box-shadow: none;
      border: none;
    }
    #videoPlayer {
      width: 100%;
      height: 100%;
      display: block;
      background: #0a0a0a;
      cursor: pointer;
      object-fit: contain;
    }
    .audio-indicator {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      padding: 4px 14px;
      border-radius: 40px;
      color: #c0d0ff;
      font-size: 11px;
      font-weight: 500;
      border: 1px solid rgba(255,255,255,0.15);
      display: none;
      align-items: center;
      gap: 6px;
      z-index: 10;
    }
    .audio-indicator i { color: #6fc3ff; }

    /* audio anim overlay */
    .audio-anim-overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 5;
      background: rgba(0,0,0,0.15);
    }
    .audio-anim-overlay.active { display: flex; }
    .anim-icon {
      font-size: 100px;
      color: #fff;
      text-shadow: 0 0 40px rgba(100,200,255,0.8), 0 0 80px rgba(255,100,200,0.6);
      animation: pulseGlow 2s infinite alternate;
    }
    @keyframes pulseGlow {
      0% { transform: scale(0.9); opacity: 0.7; text-shadow: 0 0 20px rgba(100,200,255,0.6); }
      100% { transform: scale(1.2); opacity: 1; text-shadow: 0 0 60px rgba(255,100,200,0.9), 0 0 100px rgba(100,200,255,0.8); }
    }
    .anim-icon.float { animation: floatAnim 3s ease-in-out infinite; }
    @keyframes floatAnim { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-25px) rotate(5deg); } }
    .anim-icon.spin { animation: spinAnim 4s linear infinite; }
    @keyframes spinAnim { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .anim-icon.bounce { animation: bounceAnim 1.5s ease-in-out infinite; }
    @keyframes bounceAnim { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-35px); } }
    .anim-icon.wobble { animation: wobbleAnim 2s ease-in-out infinite; }
    @keyframes wobbleAnim { 0%,100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.1); } }
    .anim-icon.pulse { animation: pulseAnim 1.2s ease-in-out infinite; }
    @keyframes pulseAnim { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .anim-icon.shake { animation: shakeAnim 0.8s infinite; }
    @keyframes shakeAnim { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-15px); } 75% { transform: translateX(15px); } }
    .anim-icon.flip { animation: flipAnim 3s ease-in-out infinite; }
    @keyframes flipAnim { 0% { transform: perspective(400px) rotateY(0); } 50% { transform: perspective(400px) rotateY(180deg); } 100% { transform: perspective(400px) rotateY(360deg); } }

    /* control bar - thin and at bottom */
    .ctrl-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 6px 10px;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,0.05);
      flex-shrink: 0;
      z-index: 20;
    }
    .ctrl-group { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .ctrl-btn {
      background: rgba(40, 40, 60, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #d0d8ff;
      width: 34px;
      height: 34px;
      border-radius: 40px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 15px rgba(80, 60, 255, 0.1);
    }
    .ctrl-btn:hover { background: rgba(80, 80, 140, 0.6); transform: scale(0.95); border-color: rgba(255,255,255,0.3); }
    .play-btn {
      width: 44px;
      background: linear-gradient(135deg, #6f8eff, #b06fff);
      border: none;
      box-shadow: 0 0 25px rgba(100, 80, 255, 0.4);
    }
    .play-btn i { filter: drop-shadow(0 0 8px rgba(255,255,255,0.5)); }
    .mini-toggle {
      background: rgba(40, 40, 60, 0.6);
      border: 1px solid rgba(255,255,255,0.08);
      color: #c0c8ff;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 11px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }
    .mini-toggle.active { background: rgba(60, 80, 180, 0.5); border-color: #6f8eff; }

    /* mini mode - keep video larger */
    .mini-mode .video-wrapper { max-height: 200px; }
    .mini-mode .ctrl-btn { width: 28px; height: 28px; font-size: 12px; }
    .mini-mode .play-btn { width: 36px; }
    .mini-mode .anim-selector-panel { display: none; }

    /* Fullscreen override: hide everything except video */
    .app-container:-webkit-full-screen .header-row,
    .app-container:-webkit-full-screen .ctrl-bar,
    .app-container:-webkit-full-screen .audio-indicator,
    .app-container:-moz-full-screen .header-row,
    .app-container:-moz-full-screen .ctrl-bar,
    .app-container:-moz-full-screen .audio-indicator,
    .app-container:fullscreen .header-row,
    .app-container:fullscreen .ctrl-bar,
    .app-container:fullscreen .audio-indicator {
      display: none !important;
    }
    .app-container:-webkit-full-screen .video-wrapper,
    .app-container:-moz-full-screen .video-wrapper,
    .app-container:fullscreen .video-wrapper {
      flex: 1;
      border-radius: 0;
      background: #000;
    }
    .app-container:-webkit-full-screen,
    .app-container:-moz-full-screen,
    .app-container:fullscreen {
      padding: 0;
      background: #000;
      border: none;
    }
    .app-container:-webkit-full-screen::before,
    .app-container:-moz-full-screen::before,
    .app-container:fullscreen::before {
      display: none;
    }

    /* Drawers - neon vibrant */
    .drawer-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 1000; display: none;
      backdrop-filter: blur(4px);
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed; top: 0; width: 300px; max-width: 85%; height: 100%;
      background: rgba(10, 10, 25, 0.92);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      z-index: 1001;
      padding: 18px 16px;
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 0 60px rgba(0,0,0,0.8);
      font-family: 'Inter', sans-serif;
    }
    .drawer-left { left: 0; transform: translateX(-105%); border-right: 2px solid rgba(255, 100, 200, 0.3); box-shadow: 0 0 40px rgba(255, 0, 200, 0.2); }
    .drawer-right { right: 0; transform: translateX(105%); border-left: 2px solid rgba(100, 200, 255, 0.3); box-shadow: 0 0 40px rgba(0, 200, 255, 0.2); }
    .drawer.open { transform: translateX(0); }
    .drawer-header {
      display: flex; justify-content: space-between; align-items: center;
      color: #f0f4ff; font-size: 17px; font-weight: 700; margin-bottom: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;
      text-shadow: 0 0 20px rgba(100, 150, 255, 0.5);
    }
    .drawer-close { background: transparent; border: none; color: #b0b6cc; font-size: 22px; cursor: pointer; }
    .drawer-section { margin-bottom: 18px; }
    .drawer-section-title {
      color: #9fa6c0; font-size: 12px; font-weight: 700; letter-spacing: 1px;
      margin-bottom: 8px; text-transform: uppercase;
      background: linear-gradient(90deg, #ff6fcf, #6f8eff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .drawer-item { margin-bottom: 10px; }
    .drawer-item label { color: #d0d6e6; font-size: 12px; display: block; margin-bottom: 3px; font-weight: 400; }
    .drawer-item select, .drawer-item input[type="range"] { width: 100%; }
    .drawer-item select {
      background: rgba(30,30,50,0.8); border: 1px solid rgba(255,255,255,0.1); color: #eceff8;
      padding: 6px 12px; border-radius: 40px; font-size: 12px; outline: none;
      font-family: 'Inter', sans-serif;
    }
    .eq-slider {
      accent-color: #6f8eff; height: 3px; background: #353541; border-radius: 10px;
      appearance: none; outline: none; width: 100%;
    }
    .eq-slider::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px; border-radius: 20px; background: #8aa3ff; border: 1px solid #c0d0ff; cursor: pointer; }
    .eq-value-row { display: flex; justify-content: space-between; color: #b0b6cc; font-size: 11px; }

    /* quality buttons - neon glow */
    .quality-btn-group { display: flex; flex-wrap: wrap; gap: 3px; }
    .quality-btn {
      background: rgba(30,30,50,0.6); border: 1px solid rgba(255,255,255,0.08); color: #bcc1d6;
      padding: 3px 8px; border-radius: 30px; font-size: 10px; font-weight: 600; cursor: pointer;
      transition: 0.2s;
    }
    .quality-btn.active { background: rgba(100, 80, 255, 0.4); border-color: #6f8eff; color: white; box-shadow: 0 0 20px rgba(100, 80, 255, 0.3); }
    .quality-btn:hover { background: rgba(80,80,160,0.3); }

    /* emoji selector */
    .anim-selector-panel {
      margin-top: 6px;
      background: rgba(0,0,0,0.3);
      border-radius: 20px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .anim-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding: 2px;
    }
    .anim-grid .anim-btn {
      background: rgba(40,40,60,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      font-size: 24px;
      padding: 6px 0;
      cursor: pointer;
      transition: 0.15s;
      text-align: center;
      color: #d0d8ff;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .anim-grid .anim-btn:hover { background: rgba(80,80,160,0.4); transform: scale(1.05); border-color: rgba(255,255,255,0.2); }
    .anim-grid .anim-btn.active {
      background: rgba(100, 80, 255, 0.4);
      border-color: #6f8eff;
      box-shadow: 0 0 20px rgba(100, 80, 255, 0.5);
    }
    .anim-style-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 8px;
      justify-content: center;
    }
    .anim-style-btn {
      background: rgba(40,40,60,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      color: #c0c8ff;
      padding: 3px 10px;
      border-radius: 30px;
      font-size: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.15s;
    }
    .anim-style-btn.active { background: rgba(100, 80, 255, 0.4); border-color: #6f8eff; color: white; box-shadow: 0 0 15px rgba(100, 80, 255, 0.3); }
    .anim-style-btn:hover { background: rgba(80,80,160,0.3); }

    /* lib items - neon touches */
    .lib-list { max-height: 160px; overflow-y: auto; }
    .lib-item {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; background: rgba(40,40,60,0.4); border-radius: 30px; margin-bottom: 3px;
      color: #d4daf0; font-size: 12px; cursor: pointer; border-left: 3px solid #6f8eff;
      transition: 0.15s;
    }
    .lib-item:hover { background: rgba(60,60,100,0.6); border-left-color: #ff6fcf; }
    .lib-item i { color: #7f9cff; }
    .lib-folder { border-left-color: #ffcc00; background: rgba(50,50,30,0.4); }

    .action-btn {
      background: rgba(40,40,60,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      color: #d4d9ec;
      padding: 6px 12px;
      border-radius: 40px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
      text-align: center;
      transition: 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
      font-family: 'Inter', sans-serif;
    }
    .action-btn:hover { background: rgba(80,80,160,0.4); border-color: rgba(255,255,255,0.2); }

    /* scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #6f8eff; border-radius: 10px; }

    /* responsive */
    @media (max-width: 480px) {
      .header-row { height: 34px; padding: 2px 8px; }
      .app-title { font-size: 14px; }
      .ctrl-btn { width: 30px; height: 30px; font-size: 13px; }
      .play-btn { width: 38px; }
      .anim-grid { grid-template-columns: repeat(5, 1fr); }
    }
  </style>
</head>
<body>
  <!-- Overlay -->
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <!-- Left Drawer (settings) -->
  <div class="drawer drawer-left" id="drawerLeft">
    <div class="drawer-header">
      <span><i class="fas fa-sliders-h"></i> Settings</span>
      <button class="drawer-close" id="closeLeftDrawer"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Video Quality</div>
      <div class="drawer-item">
        <div class="quality-btn-group" id="qualityGroupDrawer">
          <button class="quality-btn" data-quality="144">144</button>
          <button class="quality-btn" data-quality="240">240</button>
          <button class="quality-btn" data-quality="360">360</button>
          <button class="quality-btn active" data-quality="720">720</button>
          <button class="quality-btn" data-quality="1080">1080</button>
          <button class="quality-btn" data-quality="2160">4K</button>
          <button class="quality-btn" data-quality="4320">8K</button>
        </div>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Theme</div>
      <div class="drawer-item">
        <select id="themeSelectDrawer">
          <option value="dark">🌙 Dark</option><option value="red">🔴 Red</option><option value="blue">🔵 Blue</option>
          <option value="yellow">🟡 Yellow</option><option value="green">🟢 Green</option><option value="pink">🌸 Pink</option>
          <option value="purple">🟣 Purple</option>
        </select>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Voice Effect</div>
      <div class="drawer-item">
        <select id="voiceSelectDrawer">
          <option value="none">🎤 Original</option><option value="robot">🤖 Robot</option><option value="child">🧒 Child</option>
          <option value="old">👴 Old</option><option value="girl">👧 Girl</option><option value="boy">👦 Boy</option>
          <option value="underwater">🌊 Underwater</option><option value="man">👨 Man</option><option value="women">👩 Women</option>
          <option value="mobile">📱 Mobile</option>
        </select>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Equalizer</div>
      <div class="drawer-item">
        <label>Bass</label>
        <input type="range" class="eq-slider" id="bassSliderDrawer" min="0" max="200" value="100">
        <div class="eq-value-row"><span>0</span><span id="bassValDrawer">100</span><span>200</span></div>
      </div>
      <div class="drawer-item">
        <label>Mid</label>
        <input type="range" class="eq-slider" id="midSliderDrawer" min="0" max="200" value="100">
        <div class="eq-value-row"><span>0</span><span id="midValDrawer">100</span><span>200</span></div>
      </div>
      <div class="drawer-item">
        <label>Treble</label>
        <input type="range" class="eq-slider" id="trebleSliderDrawer" min="0" max="200" value="100">
        <div class="eq-value-row"><span>0</span><span id="trebleValDrawer">100</span><span>200</span></div>
      </div>
    </div>
  </div>

  <!-- Right Drawer (media & animations) -->
  <div class="drawer drawer-right" id="drawerRight">
    <div class="drawer-header">
      <span><i class="fas fa-ellipsis-v"></i> More</span>
      <button class="drawer-close" id="closeRightDrawer"><i class="fas fa-times"></i></button>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Media Library</div>
      <div class="lib-list" id="libraryListDrawer"></div>
      <button class="action-btn" id="importVideoBtn"><i class="fas fa-file-import"></i> Import Video</button>
      <button class="action-btn" style="margin-top:4px;" id="importAudioBtn"><i class="fas fa-file-audio"></i> Import Audio</button>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">🎨 Audio Visuals (30+ emojis)</div>
      <div class="anim-selector-panel">
        <div class="anim-grid" id="animGrid">
          <!-- Emojis injected via JS -->
        </div>
        <div class="anim-style-selector" id="animStyleSelector">
          <button class="anim-style-btn active" data-style="pulse">Pulse</button>
          <button class="anim-style-btn" data-style="float">Float</button>
          <button class="anim-style-btn" data-style="bounce">Bounce</button>
          <button class="anim-style-btn" data-style="spin">Spin</button>
          <button class="anim-style-btn" data-style="wobble">Wobble</button>
          <button class="anim-style-btn" data-style="shake">Shake</button>
          <button class="anim-style-btn" data-style="flip">Flip</button>
        </div>
        <button class="action-btn" id="randomAnimBtn" style="margin-top:8px;"><i class="fas fa-random"></i> Random Emoji</button>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">Support</div>
      <button class="action-btn" id="whatsappBtn"><i class="fab fa-whatsapp"></i> WhatsApp</button>
      <button class="action-btn" style="margin-top:4px;" id="feedbackBtn"><i class="fas fa-envelope"></i> Feedback</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container" id="appContainer">
    <!-- Header - super thin -->
    <div class="header-row">
      <button class="header-btn" id="openLeftDrawer"><i class="fas fa-bars"></i></button>
      <span class="app-title"><i class="fas fa-play-circle"></i> iVIDEO</span>
      <button class="header-btn" id="openRightDrawer"><i class="fas fa-ellipsis-v"></i></button>
    </div>

    <!-- Video - full remaining space -->
    <div class="video-wrapper" id="videoWrapper">
      <video id="videoPlayer" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" crossorigin="anonymous"></video>
      <div class="audio-indicator" id="audioIndicator"><i class="fas fa-headphones"></i> Audio</div>
      <div class="audio-anim-overlay" id="audioAnimOverlay">
        <div class="anim-icon" id="animIcon">🎵</div>
      </div>
    </div>

    <!-- Controls - at bottom -->
    <div class="ctrl-bar">
      <div class="ctrl-group">
        <button class="ctrl-btn play-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
        <button class="ctrl-btn" id="stopBtn"><i class="fas fa-stop"></i></button>
        <button class="ctrl-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
      </div>
      <div class="ctrl-group">
        <button class="ctrl-btn fullscreen-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
        <button class="ctrl-btn" id="audioModeToggle"><i class="fas fa-music"></i></button>
        <button class="ctrl-btn" id="backToVideoBtn" style="background:rgba(40,40,60,0.6);"><i class="fas fa-video"></i></button>
        <button class="mini-toggle" id="miniToggle"><i class="fas fa-window-minimize"></i> Mini</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      // ---- DOM refs ----
      const video = document.getElementById('videoPlayer');
      const playBtn = document.getElementById('playPauseBtn');
      const stopBtn = document.getElementById('stopBtn');
      const muteBtn = document.getElementById('muteBtn');
      const fullscreenBtn = document.getElementById('fullscreenBtn');
      const audioToggle = document.getElementById('audioModeToggle');
      const backToVideo = document.getElementById('backToVideoBtn');
      const audioIndicator = document.getElementById('audioIndicator');
      const miniToggle = document.getElementById('miniToggle');
      const appContainer = document.getElementById('appContainer');

      // Drawers
      const overlay = document.getElementById('drawerOverlay');
      const leftDrawer = document.getElementById('drawerLeft');
      const rightDrawer = document.getElementById('drawerRight');
      const openLeft = document.getElementById('openLeftDrawer');
      const openRight = document.getElementById('openRightDrawer');
      const closeLeft = document.getElementById('closeLeftDrawer');
      const closeRight = document.getElementById('closeRightDrawer');

      // Drawer elements
      const themeSelectDrawer = document.getElementById('themeSelectDrawer');
      const voiceSelectDrawer = document.getElementById('voiceSelectDrawer');
      const bassSliderDrawer = document.getElementById('bassSliderDrawer');
      const midSliderDrawer = document.getElementById('midSliderDrawer');
      const trebleSliderDrawer = document.getElementById('trebleSliderDrawer');
      const bassValDrawer = document.getElementById('bassValDrawer');
      const midValDrawer = document.getElementById('midValDrawer');
      const trebleValDrawer = document.getElementById('trebleValDrawer');
      const qualityBtnsDrawer = document.querySelectorAll('#qualityGroupDrawer .quality-btn');
      const libraryListDrawer = document.getElementById('libraryListDrawer');
      const animGrid = document.getElementById('animGrid');
      const animStyleSelector = document.getElementById('animStyleSelector');
      const randomAnimBtn = document.getElementById('randomAnimBtn');

      // Other
      const importVideoBtn = document.getElementById('importVideoBtn');
      const importAudioBtn = document.getElementById('importAudioBtn');
      const whatsappBtn = document.getElementById('whatsappBtn');
      const feedbackBtn = document.getElementById('feedbackBtn');

      // ---- State ----
      let isAudioMode = false;
      let isMini = false;
      let audioCtx = null, sourceNode = null, gainNode = null;
      let filterBass = null, filterMid = null, filterTreble = null;
      let isAudioCtxReady = false;
      let currentAnimEmoji = '🎵';
      let currentAnimStyle = 'pulse';

      // ---- Library (localStorage) ----
      const STORAGE_KEY = 'ividoe_library';
      let mediaItems = [];

      function loadLibrary() {
        try {
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) mediaItems = JSON.parse(stored);
          else {
            mediaItems = [
              { name: 'Big Buck Bunny', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4', folder: 'Samples' },
              { name: 'Elephant Dream', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4', folder: 'Samples' },
              { name: 'For Bigger Blazes', url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4', folder: 'Action' },
            ];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(mediaItems));
          }
        } catch(e) { mediaItems = []; }
        renderLibrary();
      }

      function renderLibrary() {
        libraryListDrawer.innerHTML = '';
        if (!mediaItems.length) {
          libraryListDrawer.innerHTML = '<div class="lib-item" style="border-left-color:#666;color:#888;">No media</div>';
          return;
        }
        const folders = {};
        mediaItems.forEach(item => {
          const f = item.folder || 'General';
          if (!folders[f]) folders[f] = [];
          folders[f].push(item);
        });
        for (let [folder, items] of Object.entries(folders)) {
          const folderDiv = document.createElement('div');
          folderDiv.className = 'lib-item lib-folder';
          folderDiv.innerHTML = `<i class="fas fa-folder"></i> ${folder} (${items.length})`;
          libraryListDrawer.appendChild(folderDiv);
          items.forEach(item => {
            const div = document.createElement('div');
            div.className = 'lib-item';
            div.innerHTML = `<i class="fas fa-play-circle"></i> ${item.name}`;
            div.addEventListener('click', () => { video.src = item.url; video.play(); closeDrawers(); });
            libraryListDrawer.appendChild(div);
          });
        }
      }

      window.addMedia = function(name, url, folder = 'General') {
        mediaItems.push({ name, url, folder });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(mediaItems));
        renderLibrary();
      };

      // ---- Drawer controls ----
      function openDrawer(drawer) {
        overlay.classList.add('open');
        drawer.classList.add('open');
      }
      function closeDrawers() {
        overlay.classList.remove('open');
        leftDrawer.classList.remove('open');
        rightDrawer.classList.remove('open');
      }
      overlay.addEventListener('click', closeDrawers);
      openLeft.addEventListener('click', () => { closeDrawers(); setTimeout(() => openDrawer(leftDrawer), 50); });
      openRight.addEventListener('click', () => { closeDrawers(); setTimeout(() => openDrawer(rightDrawer), 50); });
      closeLeft.addEventListener('click', closeDrawers);
      closeRight.addEventListener('click', closeDrawers);

      // ---- Video controls ----
      function updatePlayIcon() { playBtn.innerHTML = video.paused ? '<i class="fas fa-play"></i>' : '<i class="fas fa-pause"></i>'; }
      function togglePlay() { if (video.paused) video.play(); else video.pause(); }
      video.addEventListener('play', updatePlayIcon);
      video.addEventListener('pause', updatePlayIcon);
      video.addEventListener('click', (e) => { if (!isAudioMode) togglePlay(); });
      playBtn.addEventListener('click', togglePlay);
      stopBtn.addEventListener('click', () => { video.pause(); video.currentTime = 0; updatePlayIcon(); });
      muteBtn.addEventListener('click', () => { video.muted = !video.muted; muteBtn.innerHTML = video.muted ? '<i class="fas fa-volume-mute"></i>' : '<i class="fas fa-volume-up"></i>'; });

      // fullscreen - native API
      fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
          appContainer.requestFullscreen?.() || appContainer.webkitRequestFullscreen?.();
        } else {
          document.exitFullscreen?.() || document.webkitExitFullscreen?.();
        }
      });

      // audio mode
      audioToggle.addEventListener('click', () => {
        isAudioMode = !isAudioMode;
        audioIndicator.style.display = isAudioMode ? 'flex' : 'none';
        audioToggle.innerHTML = isAudioMode ? '<i class="fas fa-video"></i>' : '<i class="fas fa-music"></i>';
        backToVideo.style.display = isAudioMode ? 'inline-flex' : 'inline-flex';
        if (isAudioMode) { video.muted = false; }
        updateAnimOverlay();
      });
      backToVideo.addEventListener('click', () => {
        if (isAudioMode) {
          isAudioMode = false;
          audioIndicator.style.display = 'none';
          audioToggle.innerHTML = '<i class="fas fa-music"></i>';
          document.getElementById('audioAnimOverlay').classList.remove('active');
        }
      });

      // mini mode
      miniToggle.addEventListener('click', () => {
        isMini = !isMini;
        appContainer.classList.toggle('mini-mode', isMini);
        miniToggle.innerHTML = isMini ? '<i class="fas fa-window-maximize"></i> Maxi' : '<i class="fas fa-window-minimize"></i> Mini';
      });

      // ---- Theme ----
      function setTheme(theme) {
        appContainer.className = 'app-container theme-' + theme;
        themeSelectDrawer.value = theme;
      }
      themeSelectDrawer.addEventListener('change', function() { setTheme(this.value); });
      setTheme('dark');

      // ---- Voice & EQ ----
      function applyVoiceEffect(type) {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        if (sourceNode) { try { sourceNode.disconnect(); } catch(e) {} }
        sourceNode = audioCtx.createMediaElementSource(video);
        gainNode = audioCtx.createGain();
        filterBass = audioCtx.createBiquadFilter(); filterBass.type = 'lowshelf'; filterBass.frequency.value = 200;
        filterMid = audioCtx.createBiquadFilter(); filterMid.type = 'peaking'; filterMid.frequency.value = 1000; filterMid.Q.value = 1;
        filterTreble = audioCtx.createBiquadFilter(); filterTreble.type = 'highshelf'; filterTreble.frequency.value = 3000;

        const bassVal = parseFloat(bassSliderDrawer.value);
        const midVal = parseFloat(midSliderDrawer.value);
        const trebleVal = parseFloat(trebleSliderDrawer.value);
        filterBass.gain.value = (bassVal - 100) * 0.8;
        filterMid.gain.value = (midVal - 100) * 0.6;
        filterTreble.gain.value = (trebleVal - 100) * 0.7;

        sourceNode.connect(filterBass);
        filterBass.connect(filterMid);
        filterMid.connect(filterTreble);
        filterTreble.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'robot') { filterBass.gain.value = -10; filterMid.gain.value = 15; filterTreble.gain.value = 20; }
        else if (type === 'child') { filterBass.gain.value = -12; filterMid.gain.value = 8; filterTreble.gain.value = 18; }
        else if (type === 'old') { filterBass.gain.value = 12; filterMid.gain.value = -8; filterTreble.gain.value = -12; }
        else if (type === 'girl') { filterBass.gain.value = -8; filterMid.gain.value = 5; filterTreble.gain.value = 22; }
        else if (type === 'boy') { filterBass.gain.value = -4; filterMid.gain.value = 2; filterTreble.gain.value = 10; }
        else if (type === 'underwater') {
          filterBass.gain.value = 18; filterMid.gain.value = -10; filterTreble.gain.value = -25;
          const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 800;
          filterTreble.disconnect(); filterTreble.connect(lp); lp.connect(gainNode);
        } else if (type === 'man') { filterBass.gain.value = 8; filterMid.gain.value = -2; filterTreble.gain.value = -6; }
        else if (type === 'women') { filterBass.gain.value = -6; filterMid.gain.value = 6; filterTreble.gain.value = 14; }
        else if (type === 'mobile') {
          filterBass.gain.value = -20; filterMid.gain.value = 20; filterTreble.gain.value = 10;
          const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1000; bp.Q.value = 0.8;
          filterTreble.disconnect(); filterTreble.connect(bp); bp.connect(gainNode);
        } else { filterBass.gain.value = 0; filterMid.gain.value = 0; filterTreble.gain.value = 0; }
        updateEQDisplay();
        isAudioCtxReady = true;
      }

      function updateEQDisplay() {
        bassValDrawer.textContent = bassSliderDrawer.value;
        midValDrawer.textContent = midSliderDrawer.value;
        trebleValDrawer.textContent = trebleSliderDrawer.value;
        if (filterBass && filterMid && filterTreble) {
          filterBass.gain.value = (bassSliderDrawer.value - 100) * 0.8;
          filterMid.gain.value = (midSliderDrawer.value - 100) * 0.6;
          filterTreble.gain.value = (trebleSliderDrawer.value - 100) * 0.7;
        }
      }

      voiceSelectDrawer.addEventListener('change', function() {
        if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; } }
        applyVoiceEffect(this.value);
      });

      [bassSliderDrawer, midSliderDrawer, trebleSliderDrawer].forEach(slider => {
        slider.addEventListener('input', function() {
          updateEQDisplay();
          if (filterBass && filterMid && filterTreble) {
            const voice = voiceSelectDrawer.value;
            if (voice !== 'none') applyVoiceEffect(voice);
          }
        });
      });

      // ---- Quality ----
      qualityBtnsDrawer.forEach(btn => {
        btn.addEventListener('click', function() {
          qualityBtnsDrawer.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          const targetRes = parseInt(this.dataset.quality);
          const scale = targetRes / 720;
          video.style.transform = `scale(${Math.min(scale, 2.0)})`;
          video.style.transformOrigin = 'center center';
          video.style.objectFit = 'contain';
        });
      });

      // ---- Emoji Grid (30+ emojis) ----
      const emojiList = [
        '😀','😍','🥳','😎','🤩','😱','🤯','😈','👻','🎃','🤖','👾','🎸','🥁','🎹','🎧','📸','🌈','⭐','🔥','💧','🌊','🎵','🎶','❤️','💜','💙','💚','💛','🧡','🖤','🤍','💯','⚡','🌀','🌙','☀️','🌸','🌺','🍕','🍔','🍟','🍿','🎮','🕹️','📱','💻','⌚','📷','🔊','🔇','🎤','🎼','🎬','📽️','🎞️'
      ];
      const displayEmojis = emojiList.slice(0, 36);

      function buildAnimGrid() {
        animGrid.innerHTML = '';
        displayEmojis.forEach(emoji => {
          const btn = document.createElement('button');
          btn.className = 'anim-btn';
          if (emoji === currentAnimEmoji) btn.classList.add('active');
          btn.textContent = emoji;
          btn.dataset.emoji = emoji;
          btn.addEventListener('click', function() {
            document.querySelectorAll('#animGrid .anim-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentAnimEmoji = this.dataset.emoji;
            updateAnimOverlay();
          });
          animGrid.appendChild(btn);
        });
        // set active
        const activeBtn = animGrid.querySelector(`[data-emoji="${currentAnimEmoji}"]`);
        if (activeBtn) activeBtn.classList.add('active');
      }

      // ---- Animation style ----
      const styleBtns = animStyleSelector.querySelectorAll('.anim-style-btn');
      styleBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          styleBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentAnimStyle = this.dataset.style;
          updateAnimOverlay();
        });
      });

      // ---- Random emoji ----
      randomAnimBtn.addEventListener('click', function() {
        const randomEmoji = displayEmojis[Math.floor(Math.random() * displayEmojis.length)];
        currentAnimEmoji = randomEmoji;
        document.querySelectorAll('#animGrid .anim-btn').forEach(b => b.classList.remove('active'));
        const activeBtn = animGrid.querySelector(`[data-emoji="${randomEmoji}"]`);
        if (activeBtn) activeBtn.classList.add('active');
        updateAnimOverlay();
      });

      // ---- Update animation overlay ----
      function updateAnimOverlay() {
        const overlay = document.getElementById('audioAnimOverlay');
        const icon = document.getElementById('animIcon');
        if (isAudioMode && currentAnimEmoji) {
          overlay.classList.add('active');
          icon.textContent = currentAnimEmoji;
          icon.className = 'anim-icon';
          if (currentAnimStyle !== 'none') {
            icon.classList.add(currentAnimStyle);
          } else {
            icon.classList.add('pulse');
          }
        } else {
          overlay.classList.remove('active');
        }
      }

      // ---- Import buttons ----
      importVideoBtn.addEventListener('click', () => {
        const name = prompt('Enter video name:');
        if (!name) return;
        const url = prompt('Enter video URL:');
        if (!url) return;
        const folder = prompt('Enter folder name (optional):') || 'Imported';
        addMedia(name, url, folder);
        renderLibrary();
      });
      importAudioBtn.addEventListener('click', () => {
        const name = prompt('Enter audio name:');
        if (!name) return;
        const url = prompt('Enter audio URL (mp3):');
        if (!url) return;
        const folder = prompt('Enter folder name (optional):') || 'Audio';
        addMedia(name, url, folder);
        renderLibrary();
      });

      // ---- Support ----
      whatsappBtn.addEventListener('click', () => {
        window.open('https://wa.me/919369224174', '_blank');
      });
      feedbackBtn.addEventListener('click', () => {
        window.location.href = 'mailto:umadivy500@gmail.com?subject=iVIDEO%20Feedback';
      });

      // ---- Init audio context on play ----
      video.addEventListener('play', function() {
        if (!audioCtx) {
          try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!isAudioCtxReady && audioCtx) {
          applyVoiceEffect(voiceSelectDrawer.value);
        }
      });

      // ---- Startup ----
      loadLibrary();
      video.playbackRate = 1.0;
      updateEQDisplay();
      // default quality 720p
      document.querySelector('#qualityGroupDrawer .quality-btn[data-quality="720"]')?.classList.add('active');
      buildAnimGrid();
      document.querySelector('.anim-style-btn[data-style="pulse"]')?.classList.add('active');
      currentAnimStyle = 'pulse';
      currentAnimEmoji = '🎵';
      updateAnimOverlay();

      console.log('iVIDEO Neon Ultimate · full width · thin header · fullscreen clean');
    })();
  </script>
</body>
</html>
